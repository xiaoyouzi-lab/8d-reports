name: Quality Case Canary Gate

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run only deployment connectivity first; use full only after its gate passes.
        required: true
        default: connectivity
        type: choice
        options:
          - connectivity
          - full

  push:
    branches:
      - codex/rc2-preview-hardening

permissions:
  contents: read

concurrency:
  group: quality-case-preview-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Preview Canary (${{ inputs.phase }})
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: quality-case-preview-smoke
    env:
      PREVIEW_URL: ${{ vars.VERCEL_PREVIEW_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SMOKE_DATABASE_URL: ${{ secrets.NEON_SMOKE_DATABASE_URL }}
      SMOKE_NEON_BRANCH_NAME: ${{ vars.NEON_SMOKE_BRANCH_NAME }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PREVIEW_BUCKET: ${{ vars.R2_BUCKET_NAME }}
      SMOKE_SCOPE: quality-case
      SMOKE_DB: "true"
      SMOKE_RESULT_PATH: artifacts/authenticated-smoke.json
      SMOKE_VERIFY_INVITATION_EMAIL: "true"
      SMOKE_SUPPLIER_INVITATION_EMAIL: delivered+quality-case-supplier@resend.dev
      SMOKE_CUSTOMER_INVITATION_EMAIL: delivered+quality-case-customer@resend.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Guard Preview-only inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"
          echo "::add-mask::$SMOKE_DATABASE_URL"
          echo "::add-mask::$R2_ACCESS_KEY_ID"
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          test -n "$PREVIEW_URL"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          test "$R2_BUCKET_NAME" = "8d-reports-preview"
          [[ "$PREVIEW_URL" == https://*.vercel.app* ]]
          [[ "$PREVIEW_URL" != *"8d-reports.com"* ]]
          [[ "$SMOKE_DATABASE_URL" != *"production"* ]]
          [[ "$SMOKE_DATABASE_URL" != *"prod"* ]]
          mkdir -p artifacts

      - name: Preview DNS, TLS, and bypass preflight
        id: connectivity
        shell: bash
        run: |
          set -euo pipefail
          host="${PREVIEW_URL#https://}"
          host="${host%%/*}"
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          dns=false
          if getent ahosts "$host" >/dev/null; then dns=true; fi

          run_probe() {
            local path="$1"
            local name="$2"
            local status_file="$probe_dir/${name}.status"
            local curl_exit=0
            set +e
            curl --connect-timeout 20 --max-time 60 --silent --show-error \
              --output "$probe_dir/${name}.body" \
              --dump-header "$probe_dir/${name}.headers" --write-out '%{http_code}' \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              -H 'x-vercel-set-bypass-cookie: true' \
              "$PREVIEW_URL$path" > "$status_file"
            curl_exit=$?
            set -e
            printf '%s' "$curl_exit" > "$probe_dir/${name}.curl-exit"
          }

          run_probe "/" root
          # This endpoint is intentionally public, GET-only, and non-mutating. It
          # returns { available: boolean } without querying the application DB.
          run_probe "/api/quality-agent/chat" application

          root_status="$(cat "$probe_dir/root.status")"
          root_curl_exit="$(cat "$probe_dir/root.curl-exit")"
          app_status="$(cat "$probe_dir/application.status")"
          app_curl_exit="$(cat "$probe_dir/application.curl-exit")"
          root_sso=false
          app_sso=false
          if grep -qiE 'vercel authentication|login\.vercel\.com' "$probe_dir/root.body" "$probe_dir/root.headers"; then root_sso=true; fi
          if grep -qiE 'vercel authentication|login\.vercel\.com' "$probe_dir/application.body" "$probe_dir/application.headers"; then app_sso=true; fi
          app_contract=false
          if jq -e 'type == "object" and (.available | type == "boolean")' "$probe_dir/application.body" >/dev/null 2>&1; then app_contract=true; fi

          failure_layer="none"
          if [[ "$dns" != true ]]; then
            failure_layer="network_dns"
          elif [[ "$root_curl_exit" != 0 || "$root_status" == "000" ]]; then
            failure_layer="network_or_tls"
          elif [[ "$root_sso" == true ]]; then
            failure_layer="vercel_protection"
          elif [[ ! "$root_status" =~ ^[23] ]]; then
            failure_layer="root_route"
          elif [[ "$app_curl_exit" != 0 || "$app_status" == "000" ]]; then
            failure_layer="network_or_tls"
          elif [[ "$app_sso" == true ]]; then
            failure_layer="vercel_protection"
          elif [[ "$app_status" != "200" ]]; then
            failure_layer="application_route"
          elif [[ "$app_contract" != true ]]; then
            failure_layer="application_response"
          fi

          jq -n \
            --arg host "$host" \
            --arg rootStatus "$root_status" \
            --arg rootCurlExit "$root_curl_exit" \
            --arg appStatus "$app_status" \
            --arg appCurlExit "$app_curl_exit" \
            --arg failureLayer "$failure_layer" \
            --argjson dns "$dns" \
            --argjson rootSso "$root_sso" \
            --argjson appSso "$app_sso" \
            --argjson appContract "$app_contract" \
            '{gate:"connectivity", host:$host, dns:$dns, root:{httpStatus:$rootStatus,curlExit:$rootCurlExit,ssoDetected:$rootSso}, application:{path:"/api/quality-agent/chat",httpStatus:$appStatus,curlExit:$appCurlExit,ssoDetected:$appSso,responseContract:$appContract}, failureLayer:$failureLayer, ssoBypassed:(($rootSso or $appSso) | not), applicationReached:($appStatus == "200" and $appContract)}' \
            > artifacts/connectivity-summary.json

          if [[ "$failure_layer" != "none" ]]; then
            exit 1
          fi

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
        run: npm ci

      - name: Require isolated full-smoke inputs
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SMOKE_DATABASE_URL"
          test -n "$SMOKE_NEON_BRANCH_NAME"
          [[ "$SMOKE_NEON_BRANCH_NAME" == *"smoke"* || "$SMOKE_NEON_BRANCH_NAME" == *"preview"* ]]
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_ENDPOINT"

      - name: Migrate, rehearse rollback, and seed isolated data
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          npx drizzle-kit push --force
          npm run smoke:db:rehearse-quality-case
          npm run smoke:seed-auth

      - name: Verify dedicated R2 cleanup and compensation
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
        shell: bash
        run: |
          set -euo pipefail
          unset R2_BUCKET_NAME
          export R2_PREVIEW_RESULT_PATH=artifacts/r2-preview.json
          npm run smoke:r2-preview
          export R2_BUCKET_NAME="$R2_PREVIEW_BUCKET"

      - name: Run deployed Quality Case lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          export SMOKE_BASE_URL="$PREVIEW_URL"
          npm run smoke:auth

      - name: Produce redacted report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const out = { phase: process.env.INPUT_PHASE || 'unknown' };
          for (const [name, path] of Object.entries({
            authenticated: 'artifacts/authenticated-smoke.json',
            r2: 'artifacts/r2-preview.json',
            connectivity: 'artifacts/connectivity-summary.json',
          })) {
            if (!fs.existsSync(path)) continue;
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            out[name] = {
              status: value.status || null,
              checks: value.checks || null,
              completedSteps: Array.isArray(value.completedSteps) ? value.completedSteps.length : null,
              cleanupVerified: value.cleanupVerified ?? null,
              dns: value.dns ?? null,
              tlsAndHttp: value.tlsAndHttp ?? null,
              httpStatus: value.httpStatus || null,
              apiHttpStatus: value.apiHttpStatus || null,
              failureLayer: value.failureLayer || null,
              ssoBypassed: value.ssoBypassed ?? null,
              applicationReached: value.applicationReached ?? null,
              root: value.root ? {
                httpStatus: value.root.httpStatus || null,
                curlExit: value.root.curlExit || null,
                ssoDetected: value.root.ssoDetected ?? null,
              } : null,
              application: value.application ? {
                path: value.application.path || null,
                httpStatus: value.application.httpStatus || null,
                curlExit: value.application.curlExit || null,
                ssoDetected: value.application.ssoDetected ?? null,
                responseContract: value.application.responseContract ?? null,
              } : null,
            };
          }
          fs.writeFileSync('artifacts/canary-summary.json', `${JSON.stringify(out, null, 2)}\n`);
          NODE
        env:
          INPUT_PHASE: ${{ inputs.phase }}

      - name: Clean smoke accounts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.phase == 'full'
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          export CONFIRM_SMOKE_FIXTURE_CLEANUP=true
          npm run smoke:cleanup-auth

      - name: Upload redacted Canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-case-canary-${{ github.run_id }}
          path: artifacts/canary-summary.json
          if-no-files-found: error
          retention-days: 14
